<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>תוצאות הבחירות בזמן אמת</title>
<style>
:root {
  color-scheme: light;
  --bg: #f3f3f1; --surface: #fcfcfb; --surface-2: #efeeea; --surface-3: #e6e5e0; --border: #e0dfda;
  --text: #0b0b0b; --text-2: #52514e; --muted: #85847e; --accent: #2a78d6;
  --bloc-N: #2a78d6; --bloc-O: #eb6834; --bloc-A: #1baf7a; --bloc-X: #eda100;
  --pos: #2a78d6; --neg: #e34948; --good: #0ca30c; --warn: #fab219; --crit: #d03b3b; --mid: #e9e8e4;
  --shadow: 0 1px 2px rgba(0,0,0,.04), 0 4px 16px rgba(0,0,0,.04);
}
@media (prefers-color-scheme: dark) {
  :root:where(:not([data-theme="light"])) {
    color-scheme: dark;
    --bg: #111110; --surface: #1a1a19; --surface-2: #232321; --surface-3: #2c2c29; --border: #33332f;
    --text: #f0efec; --text-2: #c3c2b7; --muted: #8f8e86; --accent: #3987e5;
    --bloc-N: #3987e5; --bloc-O: #d95926; --bloc-A: #199e70; --bloc-X: #c98500;
    --pos: #3987e5; --neg: #e66767; --mid: #2c2c29; --shadow: none;
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --bg: #111110; --surface: #1a1a19; --surface-2: #232321; --surface-3: #2c2c29; --border: #33332f;
  --text: #f0efec; --text-2: #c3c2b7; --muted: #8f8e86; --accent: #3987e5;
  --bloc-N: #3987e5; --bloc-O: #d95926; --bloc-A: #199e70; --bloc-X: #c98500;
  --pos: #3987e5; --neg: #e66767; --mid: #2c2c29; --shadow: none;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--text); font: 14px/1.5 system-ui, -apple-system, "Segoe UI", "Rubik", "Assistant", Arial, sans-serif; }
a { color: inherit; }
header { position: sticky; top: 0; z-index: 10; background: var(--surface); border-bottom: 1px solid var(--border); }
.hwrap { max-width: 1440px; margin: 0 auto; padding: 10px 16px 0; }
.hrow { display: flex; flex-wrap: wrap; gap: 8px 14px; align-items: center; }
.brand { display: flex; align-items: center; gap: 10px; }
.logo { width: 30px; height: 30px; border-radius: 8px; background: conic-gradient(var(--bloc-N) 0 50%, var(--bloc-O) 0 80%, var(--bloc-A) 0 92%, var(--bloc-X) 0); flex: none; }
h1 { font-size: 17px; margin: 0; font-weight: 700; letter-spacing: -.01em; }
.sub { color: var(--text-2); font-size: 12.5px; }
.pill { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--border); border-radius: 99px; padding: 2px 10px; font-size: 12px; color: var(--text-2); background: var(--surface); white-space: nowrap; }
.dot { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); }
.dot.live { background: var(--good); animation: pulse 2s infinite; }
.dot.stale { background: var(--warn); } .dot.err { background: var(--crit); }
@keyframes pulse { 0% { box-shadow: 0 0 0 0 rgba(12,163,12,.45); } 70% { box-shadow: 0 0 0 7px rgba(12,163,12,0); } 100% { box-shadow: 0 0 0 0 rgba(12,163,12,0); } }
.spacer { flex: 1; }
button, .btn { font: inherit; font-size: 13px; background: var(--surface-2); color: var(--text); border: 1px solid var(--border); border-radius: 8px; padding: 5px 11px; cursor: pointer; text-decoration: none; display: inline-flex; align-items: center; gap: 6px; }
button:hover, .btn:hover { border-color: var(--muted); }
button:disabled { opacity: .45; cursor: default; }
button.primary { background: var(--accent); color: #fff; border-color: transparent; }
.search { position: relative; }
.search input { width: 240px; padding-inline-start: 30px; }
.search::before { content: "⌕"; position: absolute; inset-inline-start: 10px; top: 4px; color: var(--muted); font-size: 16px; }
.results { position: absolute; top: 34px; inset-inline-start: 0; width: 320px; max-height: 420px; overflow: auto; background: var(--surface); border: 1px solid var(--border); border-radius: 10px; box-shadow: 0 8px 30px rgba(0,0,0,.18); z-index: 30; }
.results a { display: flex; justify-content: space-between; gap: 8px; padding: 8px 12px; text-decoration: none; border-bottom: 1px solid var(--border); }
.results a:hover, .results a.sel { background: var(--surface-2); }
.progress { position: relative; height: 6px; background: var(--surface-3); border-radius: 3px; overflow: hidden; margin-top: 10px; }
.progress > div { position: absolute; inset-block: 0; inset-inline-start: 0; background: linear-gradient(270deg, var(--bloc-N), var(--bloc-A)); transition: width .8s; }
.simbar { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; margin-top: 10px; padding: 8px 12px; border-radius: 10px; background: color-mix(in srgb, var(--warn) 14%, var(--surface)); border: 1px solid color-mix(in srgb, var(--warn) 45%, var(--border)); }
.simbar .clock { font-weight: 700; font-variant-numeric: tabular-nums; }
nav { display: flex; gap: 2px; margin-top: 6px; overflow-x: auto; scrollbar-width: none; }
nav a { padding: 8px 12px; border-bottom: 2px solid transparent; color: var(--text-2); text-decoration: none; white-space: nowrap; font-weight: 500; }
nav a.on { color: var(--text); border-bottom-color: var(--accent); }
main { padding: 16px; max-width: 1440px; margin: 0 auto; }
.grid { display: grid; gap: 14px; }
.g-kpi { grid-template-columns: repeat(auto-fit, minmax(165px, 1fr)); }
.g-2 { grid-template-columns: repeat(auto-fit, minmax(440px, 1fr)); }
.g-3 { grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); }
.g-main { grid-template-columns: minmax(0, 1.25fr) minmax(0, 1fr); }
@media (max-width: 980px) { .g-main { grid-template-columns: 1fr; } }
@media (max-width: 520px) { .g-2, .g-3 { grid-template-columns: 1fr; } .search input { width: 150px; } main { padding: 12px; } }
.mt { margin-top: 14px; }
.card { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 16px; min-width: 0; overflow-x: auto; box-shadow: var(--shadow); }
.card h2 { font-size: 15px; margin: 0 0 12px; font-weight: 650; display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; }
.card h2 small { font-weight: 400; color: var(--muted); font-size: 12px; }
.card h2 .tools { margin-inline-start: auto; display: flex; gap: 4px; }
.kpi .lbl { color: var(--text-2); font-size: 12.5px; }
.kpi .val { font-size: 26px; font-weight: 700; font-variant-numeric: tabular-nums; letter-spacing: -.02em; }
.kpi .cmp { font-size: 12px; color: var(--text-2); font-variant-numeric: tabular-nums; }
.up { color: var(--pos); } .down { color: var(--neg); }
table { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
th, td { padding: 6px 8px; border-bottom: 1px solid var(--border); text-align: start; white-space: nowrap; }
th { color: var(--text-2); font-weight: 500; font-size: 12px; position: sticky; top: 0; background: var(--surface); z-index: 1; }
td.n, th.n { text-align: end; }
th.sort { cursor: pointer; user-select: none; } th.sort:hover { color: var(--text); }
tbody tr.click { cursor: pointer; }
tbody tr:hover { background: var(--surface-2); }
.scroll { overflow: auto; max-height: 620px; }
.sw { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-inline-end: 6px; vertical-align: -1px; flex: none; }
.letter { display: inline-flex; align-items: center; justify-content: center; min-width: 30px; height: 22px; padding: 0 5px; border-radius: 6px; font-weight: 700; font-size: 12px; color: #fff; }
.bar { position: relative; height: 10px; background: var(--surface-3); border-radius: 3px; min-width: 70px; }
.bar > i { position: absolute; inset-block: 0; inset-inline-start: 0; border-start-end-radius: 4px; border-end-end-radius: 4px; transition: width .6s; }
.bar > b { position: absolute; top: -3px; bottom: -3px; width: 2px; background: var(--text-2); }
.div { position: relative; height: 10px; min-width: 90px; background: var(--mid); border-radius: 3px; }
.div > i { position: absolute; inset-block: 0; }
.div::after { content: ""; position: absolute; left: 50%; top: -2px; bottom: -2px; width: 1px; background: var(--muted); }
.tag { font-size: 11px; padding: 1px 7px; border-radius: 99px; border: 1px solid var(--border); color: var(--text-2); white-space: nowrap; }
.tag.bad { border-color: var(--crit); color: var(--crit); } .tag.ok { border-color: var(--good); color: var(--good); }
.tag.warn { border-color: var(--warn); }
.seg { display: inline-flex; background: var(--surface-2); border-radius: 8px; padding: 2px; gap: 2px; flex-wrap: wrap; }
.seg button { border: none; background: none; padding: 3px 10px; border-radius: 6px; font-size: 12.5px; }
.seg button.on { background: var(--surface); color: var(--text); box-shadow: 0 1px 2px rgba(0,0,0,.15); font-weight: 650; }
.legend { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: 12px; color: var(--text-2); margin-top: 8px; }
ul.ins { margin: 0; padding: 0; list-style: none; }
ul.ins li { padding: 8px 26px 8px 0; border-bottom: 1px solid var(--border); position: relative; }
ul.ins li::before { position: absolute; right: 2px; top: 8px; font-size: 12px; }
ul.ins li.up::before { content: "▲"; color: var(--pos); } ul.ins li.down::before { content: "▼"; color: var(--neg); }
ul.ins li.warn::before { content: "⚠"; color: var(--warn); } ul.ins li.key::before { content: "★"; color: var(--text); }
ul.ins li.info::before { content: "•"; color: var(--muted); }
.controls { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 12px; align-items: center; }
input, select { font: inherit; font-size: 13px; padding: 5px 9px; border: 1px solid var(--border); border-radius: 8px; background: var(--surface); color: var(--text); }
.hide { display: none !important; }
.muted { color: var(--muted); }
#tip { position: fixed; pointer-events: none; z-index: 50; background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: 7px 9px; font-size: 12px; box-shadow: 0 6px 20px rgba(0,0,0,.18); display: none; font-variant-numeric: tabular-nums; max-width: 300px; }
svg text { fill: var(--text-2); font-size: 11px; }
.empty { padding: 60px 20px; text-align: center; color: var(--text-2); }
.crumb { display: flex; gap: 6px; align-items: center; color: var(--text-2); font-size: 13px; margin-bottom: 10px; }
.crumb a { text-decoration: none; color: var(--accent); }
.pagehead { display: flex; flex-wrap: wrap; gap: 10px 16px; align-items: center; margin-bottom: 14px; }
.pagehead h2 { font-size: 24px; margin: 0; font-weight: 750; letter-spacing: -.02em; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { display: inline-flex; align-items: center; gap: 6px; padding: 5px 10px; border-radius: 99px; border: 1px solid var(--border); background: var(--surface); cursor: pointer; font-size: 13px; user-select: none; }
.chip.on { border-color: var(--text); background: var(--surface-2); font-weight: 600; }
.meter { position: relative; height: 34px; background: var(--surface-3); border-radius: 8px; overflow: hidden; display: flex; }
.meter > div { height: 100%; display: flex; align-items: center; justify-content: center; color: #fff; font-size: 12px; font-weight: 700; border-inline-start: 2px solid var(--surface); }
.meter .line { position: absolute; top: 0; bottom: 0; width: 2px; background: var(--text); }
.toast { position: fixed; bottom: 18px; left: 18px; z-index: 60; background: var(--text); color: var(--surface); padding: 10px 14px; border-radius: 10px; box-shadow: 0 8px 30px rgba(0,0,0,.25); font-size: 13px; transform: translateY(140px); transition: transform .35s; max-width: 380px; }
.toast.show { transform: none; }
.flash { animation: flash 2.4s ease-out; }
@keyframes flash { 0% { background: color-mix(in srgb, var(--warn) 35%, transparent); } 100% { background: transparent; } }
.hist { display: flex; align-items: flex-end; gap: 2px; height: 120px; direction: ltr; }
.hist > div { flex: 1; border-radius: 3px 3px 0 0; min-height: 1px; transition: height .5s cubic-bezier(.4,0,.2,1), background .3s; }
.nowrap { white-space: nowrap; }
.note { font-size: 12px; color: var(--muted); margin-top: 8px; }
code { font-size: 12px; background: var(--surface-2); padding: 1px 5px; border-radius: 4px; }

/* ================= motion & micro-interactions ================= */
:root { --ease: cubic-bezier(.4,0,.2,1); --ease-out: cubic-bezier(.16,1,.3,1); --dur: 320ms; --dur-fast: 180ms; }
* { -webkit-tap-highlight-color: transparent; }

/* buttons & links: subtle hover + press */
button, .btn { transition: background var(--dur-fast) var(--ease), border-color var(--dur-fast) var(--ease), color var(--dur-fast) var(--ease), transform 120ms var(--ease), box-shadow var(--dur-fast) var(--ease); will-change: transform; }
button:hover, .btn:hover { background: var(--surface-3); }
button:active, .btn:active { transform: scale(.96); }
button.primary:hover { filter: brightness(1.08); }
.seg button { transition: background var(--dur-fast) var(--ease), color var(--dur-fast) var(--ease), transform 120ms var(--ease), box-shadow var(--dur-fast) var(--ease); }
.seg button.on { transform: none; }

/* cards: lift on hover, no lift on tables inside the card */
.card { transition: border-color var(--dur-fast) var(--ease), box-shadow var(--dur) var(--ease), transform var(--dur) var(--ease); }
.card:hover { border-color: color-mix(in srgb, var(--muted) 55%, var(--border)); box-shadow: 0 2px 4px rgba(0,0,0,.04), 0 10px 28px rgba(0,0,0,.06); }
.kpi { transition: transform var(--dur) var(--ease), box-shadow var(--dur) var(--ease), border-color var(--dur-fast) var(--ease); }
.kpi:hover { transform: translateY(-1px); }
.card tbody tr { transition: background 140ms var(--ease); }

/* nav tab underline: slide in */
nav a { transition: color var(--dur-fast) var(--ease); border-bottom-color: transparent !important; position: relative; }
nav a::after { content: ""; position: absolute; left: 10px; right: 10px; bottom: 0; height: 2px; background: var(--accent); border-radius: 2px; transform: scaleX(0); transform-origin: center; transition: transform var(--dur) var(--ease-out), opacity var(--dur-fast); opacity: 0; }
nav a:hover { color: var(--text); }
nav a:hover::after { transform: scaleX(.5); opacity: .35; }
nav a.on::after { transform: scaleX(1); opacity: 1; }

/* bars + dividers + progress smoother */
.bar > i, .div > i { transition: width .9s var(--ease), background .3s; }
.progress > div { transition: width 1s var(--ease); }
.meter > div { transition: flex-basis .9s var(--ease), width .9s var(--ease), background .3s; }
.meter .line { transition: left .9s var(--ease), right .9s var(--ease); }

/* seat chart: smooth color morphs on seat reallocation + fade-in */
svg.hemicycle circle { transition: fill .55s var(--ease), opacity .4s var(--ease); }
svg.hemicycle circle.seat-dim { opacity: .18; }
svg.hemicycle text { transition: fill .4s var(--ease); }

/* KPI value pulse when it changes (JS adds .tick momentarily) */
.kpi .val { transition: color .4s var(--ease); font-variant-numeric: tabular-nums; }
.kpi .val.tick { color: var(--accent); }
.kpi .cmp .up, .kpi .cmp .down { transition: color .4s var(--ease); }

/* toast: entry + exit, soft ease */
.toast { transition: transform .4s var(--ease-out), opacity .25s var(--ease); opacity: 0; }
.toast.show { transform: none; opacity: 1; }

/* tag pills: hover feedback */
.tag, .chip { transition: border-color var(--dur-fast) var(--ease), background var(--dur-fast) var(--ease), color var(--dur-fast) var(--ease); }
.chip:hover { border-color: var(--muted); }
.pill { transition: border-color var(--dur-fast) var(--ease), background var(--dur-fast) var(--ease); }

/* search results: slide-fade in */
.results { animation: resultsIn .22s var(--ease-out) both; transform-origin: top; }
@keyframes resultsIn { from { opacity: 0; transform: translateY(-4px) scale(.98); } to { opacity: 1; transform: none; } }

/* "new" locality flash (already defined — tune color + duration) */
.flash { animation: flash 2.4s var(--ease-out) both; }
@keyframes flash { 0% { background: color-mix(in srgb, var(--warn) 42%, transparent); } 60% { background: color-mix(in srgb, var(--warn) 10%, transparent); } 100% { background: transparent; } }

/* ----- View Transitions API: cross-fade on route / state updates ----- */
main { view-transition-name: dash-main; }
::view-transition-old(dash-main), ::view-transition-new(dash-main) {
  animation-duration: 360ms; animation-timing-function: var(--ease);
}
::view-transition-old(dash-main) { animation-name: vt-fade-out; }
::view-transition-new(dash-main) { animation-name: vt-fade-in; }
@keyframes vt-fade-out { to { opacity: 0; transform: translateY(-2px); } }
@keyframes vt-fade-in  { from { opacity: 0; transform: translateY(4px); } }

/* reduced motion: honor user preference */
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: .001ms !important; transition-duration: .001ms !important; }
}
</style>
</head>
<body>
<header>
  <div class="hwrap">
    <div class="hrow">
      <div class="brand"><div class="logo"></div><div><h1>תוצאות הבחירות לכנסת · בזמן אמת</h1><div class="sub" id="subtitle"></div></div></div>
      <span class="pill"><span class="dot" id="statusDot"></span><span id="statusText">מתחבר…</span></span>
      <span class="pill" id="siteStatus" style="display:none"></span>
      <span class="spacer"></span>
      <span class="seg" id="modeSeg" title="מצב מקור הנתונים">
        <button data-mode="live" title="נתוני אתר האמת">חי</button>
        <button data-mode="simulate" title="סימולציה: תוצאות 2022 עם שינויים אקראיים">סימולציה</button>
        <button data-mode="baseline" title="נתוני 2022 הסופיים כנתוני-על">2022</button>
      </span>
      <div class="search"><input id="q" placeholder="חיפוש יישוב או מפלגה…  ( / )" autocomplete="off"><div class="results hide" id="qres"></div></div>
      <span class="sub" id="updated"></span>
      <button id="refresh" title="בדיקה מיידית באתר">↻ רענון</button>
      <label class="btn" title="אם האתר חוסם גישה אוטומטית: הורידו את expc.csv / expb.csv מהאתר והעלו כאן">⇪ העלאת CSV<input type="file" id="upload" accept=".csv" hidden></label>
      <button id="theme" title="מצב תצוגה">◐</button>
    </div>
    <div class="simbar hide" id="simbar"></div>
    <div class="progress" id="progress"><div id="progressBar" style="width:0"></div></div>
    <nav id="tabs">
      <a href="#/overview" data-tab="overview">סקירה</a>
      <a href="#/parties" data-tab="parties">מפלגות</a>
      <a href="#/cities" data-tab="cities">יישובים</a>
      <a href="#/ballot" data-tab="ballot">קלפיות</a>
      <a href="#/sectors" data-tab="sectors">מגזרים</a>
      <a href="#/coalition" data-tab="coalition">מנדטים וקואליציה</a>
      <a href="#/timeline" data-tab="timeline">לאורך הספירה</a>
      <a href="#/feed" data-tab="feed">מקור הנתונים</a>
    </nav>
  </div>
</header>
<main id="view"></main>
<div id="tip"></div>
<div class="toast" id="toast"></div>

<script>
"use strict";
const $ = s => document.querySelector(s);
const $$ = (s, el = document) => [...el.querySelectorAll(s)];
let S = null, CFG = null, STATUS = null, prevKey = null, newCodes = new Set(), lastToast = 0;
const cache = {};
const LRM = "‎";
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const nf = n => n == null ? "–" : Math.round(n).toLocaleString("he-IL");
const pc = (x, d = 1) => x == null ? "–" : (x * 100).toFixed(d) + "%";
const pp = (x, d = 1) => x == null ? "–" : LRM + (x >= 0 ? "+" : "−") + Math.abs(x * 100).toFixed(d);
const cls = x => x == null ? "" : x > 0.0005 ? "up" : x < -0.0005 ? "down" : "";
const blocColor = k => `var(--bloc-${k || "X"})`;
const SECTORS = { arab: "ערבים ובדואים", haredi: "חרדים", large: "ערים גדולות", jewish: "יהודים – אחר", envelopes: "מעטפות חיצוניות", new: "חדשים" };
const BLOC_ORDER = ["A", "O", "X", "N"];
const mapCity = () => cache.cityMap || (cache.cityMap = new Map((S ? S.cities : []).map(c => [c.code, c])));
const js = s => esc(JSON.stringify(String(s)));  // safe JS string literal inside an HTML attribute

function party(l) { return (CFG && CFG.current[l]) || { letter: l, short_he: l, he: l, bloc: "X", family: "other" }; }
function bparty(l) { return (CFG && CFG.baseline[l]) || { letter: l, short_he: l, he: l, bloc: "X", family: "other" }; }
function famColor(f) { return (CFG && CFG.families[f] && CFG.families[f].color) || "#9ca3af"; }
function pColor(p) { return famColor(p.family); }
function famName(f) { const x = CFG && CFG.families[f]; return x ? (x.he || x.name) : f; }
function blocName(k) { const x = CFG && CFG.blocs[k]; return x ? (x.he || x.name) : k; }
function letterBadge(p) { return `<span class="letter" style="background:${pColor(p)}">${esc(p.letter)}</span>`; }
function shareBar(v, max, color, thr) {

  const t = (22 * 3600 + rest) % 86400, day = d + 1 + (22 * 3600 + rest >= 86400 ? 1 : 0);

let curRoute = "";
function withVT(fn) {
  // cross-fade on route change. requires Chromium 111+/Safari 18. firefox falls through.
  if (!document.startViewTransition || document.visibilityState !== "visible") { fn(); return; }
  try { document.startViewTransition(fn); } catch (e) { fn(); }
}
function tickKpis() {
  // pulse values that changed since the previous render — compared by data-key
  const map = tickKpis._prev || (tickKpis._prev = new Map());
  $$(".kpi .val[data-key]").forEach(el => {
    const k = el.dataset.key, v = el.textContent.trim();
    if (map.has(k) && map.get(k) !== v) {
      el.classList.remove("tick"); void el.offsetWidth; el.classList.add("tick");
      setTimeout(() => el.classList.remove("tick"), 650);
    }
    map.set(k, v);
  });
}
function renderInto(fn) {
  // Replace the view with new HTML in one synchronous mutation. innerHTML inside
  // a single JS tick does not paint a blank frame — the browser only commits once.
  fn();
  requestAnimationFrame(tickKpis);
}

  const parts = (location.hash.replace(/^#\/?/, "") || "overview").split("/").map(decodeURIComponent);
  const name = routes[parts[0]] ? parts[0] : "overview";

    curRoute = ""; return;
  }

  if (isUpdate && (name === "ballot") && curRoute === location.hash) return;

// ---------- hemicycle (Knesset seating chart)
function hemicycle(groups, opts = {}) {
  const total = 120, rows = 8, r0 = 0.38, W = 520, H = 290, cx = W / 2, cy = H - 14, R = 250;
  const radii = Array.from({ length: rows }, (_, i) => r0 + (1 - r0) * (i + 0.5) / rows);
  const sumR = radii.reduce((a, b) => a + b, 0);
  const counts = radii.map(r => Math.round(total * r / sumR));
  counts[rows - 1] += total - counts.reduce((a, b) => a + b, 0);
  const pts = [];
  radii.forEach((r, i) => { const n = counts[i]; for (let j = 0; j < n; j++) pts.push({ th: Math.PI - Math.PI * (n === 1 ? 0.5 : j / (n - 1)), r }); });
  pts.sort((a, b) => b.th - a.th || a.r - b.r);
  const dot = R * (1 - r0) / rows * 0.42;
  let k = 0, g = "";
  for (const grp of groups) for (let i = 0; i < grp.n && k < pts.length; i++, k++) {
    const p = pts[k], x = cx + R * p.r * Math.cos(p.th), y = cy - R * p.r * Math.sin(p.th);
    const dim = opts.highlight && !opts.highlight.has(grp.key);
    g += `<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="${dot.toFixed(1)}" fill="${grp.color}" opacity="${dim ? 0.16 : 1}" data-tip="<b>${esc(grp.label)}</b><br>${grp.n} מנדטים"${opts.clickable ? ` style="cursor:pointer" onclick="${opts.clickable}(${js(grp.key)})"` : ""}/>`;
  }
  for (; k < pts.length; k++) { const p = pts[k]; g += `<circle cx="${(cx + R * p.r * Math.cos(p.th)).toFixed(1)}" cy="${(cy - R * p.r * Math.sin(p.th)).toFixed(1)}" r="${dot.toFixed(1)}" fill="var(--surface-3)"/>`; }
  return `<svg class="hemicycle" viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="מושבי הכנסת">${g}<text x="${cx}" y="${cy - 30}" text-anchor="middle" style="font-size:34px;font-weight:800;fill:var(--text)">${opts.center ?? ""}</text><text x="${cx}" y="${cy - 8}" text-anchor="middle">${esc(opts.caption || "")}</text></svg>`;
}
function seatGroups(source) {
  let arr;
  if (source === "base") arr = Object.entries(S.baseline_national.seats).map(([l, n]) => ({ ...bparty(l), n }));
  else arr = S.parties.map(p => ({ ...p, n: p[source] || 0 }));
  arr = arr.filter(p => p.n > 0);
  arr.sort((a, b) => BLOC_ORDER.indexOf(a.bloc) - BLOC_ORDER.indexOf(b.bloc) || (a.bloc === "N" ? a.n - b.n : b.n - a.n));
  return arr.map(p => ({ key: p.letter, n: p.n, color: pColor(p), label: `${p.short_he} (${p.letter})`, bloc: p.bloc }));
}

function thresholdChart(rows) {
  if (!rows.length) return '<p class="muted">אין רשימות בטווח.</p>';
  const lo = 0.015, hi = 0.055, W = 560, rowH = 28, Ht = rows.length * rowH + 30, l = 150, r = 20;
  const x = v => l + (v - lo) / (hi - lo) * (W - l - r);
  let g = `<line x1="${x(0.0325)}" x2="${x(0.0325)}" y1="0" y2="${Ht - 18}" stroke="var(--crit)" stroke-dasharray="4 3"/><text x="${x(0.0325)}" y="${Ht - 4}" text-anchor="middle" style="fill:var(--crit)">3.25%</text>`;
  [0.02, 0.03, 0.04, 0.05].forEach(v => g += `<line x1="${x(v)}" x2="${x(v)}" y1="0" y2="${Ht - 18}" stroke="var(--border)"/><text x="${x(v)}" y="${Ht - 4}" text-anchor="middle">${v * 100}%</text>`);
  rows.forEach((p, i) => { const y = i * rowH + 14, v = Math.min(hi, p.pct);
    g += `<g style="cursor:pointer" onclick="goParty(${js(p.letter)})" data-tip="<b>${esc(p.short_he)}</b><br>${pc(p.pct, 2)} · ${p.passes ? "עוברת" : "חסרים " + nf(p.to_threshold) + " קולות"}"><text x="${l - 8}" y="${y + 4}" text-anchor="end" style="fill:var(--text);direction:rtl;unicode-bidi:plaintext">${esc(p.short_he)}</text>
    <line x1="${x(0.0325)}" x2="${x(v)}" y1="${y}" y2="${y}" stroke="${p.passes ? "var(--good)" : "var(--crit)"}" stroke-width="2"/><circle cx="${x(v)}" cy="${y}" r="6" fill="${pColor(p)}" stroke="var(--surface)" stroke-width="2"/></g>`; });
  return `<svg viewBox="0 0 ${W} ${Ht}" width="100%" style="direction:ltr">${g}</svg>`;
}

function cityRows() {
  const q = $("#cq").value.trim(), sec = $("#csec").value, rep = +$("#crep").value, flip = $("#cflip").checked, minEl = +$("#cmin").value || 0;
  let rows = S.cities.filter(c => (!q || c.name.includes(q) || String(c.code) === q) && (!sec || c.sector === sec)
    && (rep === 0 || (rep === -1 ? !c.valid : (rep === 1 ? c.valid : c.reporting >= rep))) && (!flip || c.flipped) && ((c.base_eligible || c.eligible || 0) >= minEl));
  const k = citySort.k, d = citySort.dir;
  const val = c => k.startsWith("swing") ? (c.bloc_swing ? c.bloc_swing[k.slice(5)] : null) : c[k];
  rows.sort((a, b) => { const x = val(a), y = val(b); if (x == null && y == null) return 0; if (x == null) return 1; if (y == null) return -1; return typeof x === "string" ? d * x.localeCompare(y, "he") : d * (x - y); });
  return rows;
}
const secColor = k => ({ arab: "var(--bloc-A)", haredi: "#8b5cf6", large: "var(--bloc-N)", jewish: "var(--bloc-O)" })[k] || "var(--muted)";

}
function scatter() {
  const el = $("#scatter"); if (!el) return;
  const pts = S.cities.filter(c => c.turnout_delta != null && c.bloc_swing && (c.base_eligible || 0) >= 2000 && c.sector !== "envelopes");
  if (!pts.length) { el.innerHTML = '<p class="muted">אין עדיין מספיק יישובים שדיווחו.</p>'; return; }
  const W = Math.max(360, el.clientWidth || 900), H = 340, m = { l: 50, r: 20, t: 14, b: 34 };
  const ext = a => Math.min(0.5, Math.max(0.02, ...a.map(Math.abs)) * 1.08);
  const xm = ext(pts.map(c => c.turnout_delta)), ym = ext(pts.map(c => c.bloc_swing.N));
  const X = v => m.l + (v + xm) / (2 * xm) * (W - m.l - m.r), Y = v => m.t + (1 - (v + ym) / (2 * ym)) * (H - m.t - m.b);
  const maxEl = Math.max(...pts.map(c => c.base_eligible));
  let g = `<line x1="${X(0)}" x2="${X(0)}" y1="${m.t}" y2="${H - m.b}" stroke="var(--muted)"/><line x1="${m.l}" x2="${W - m.r}" y1="${Y(0)}" y2="${Y(0)}" stroke="var(--muted)"/>`;
  [-1, -0.5, 0.5, 1].forEach(f => { g += `<text x="${X(f * xm)}" y="${H - 14}" text-anchor="middle">${(f * xm * 100).toFixed(1)}</text><text x="${m.l - 6}" y="${Y(f * ym) + 4}" text-anchor="end">${(f * ym * 100).toFixed(1)}</text>`; });
  g += `<text x="${W - m.r}" y="${H - 1}" text-anchor="end">שינוי באחוז ההצבעה (נק׳) →</text><text x="${m.l + 4}" y="${m.t + 8}" text-anchor="start">↑ שינוי בגוש נתניהו (נק׳)</text>`;
  pts.sort((a, b) => b.base_eligible - a.base_eligible).forEach(c => {
    const r = 2.5 + 16 * Math.sqrt(c.base_eligible / maxEl);
    g += `<circle cx="${X(c.turnout_delta).toFixed(1)}" cy="${Y(c.bloc_swing.N).toFixed(1)}" r="${r.toFixed(1)}" fill="${secColor(c.sector)}" fill-opacity=".55" stroke="var(--surface)" stroke-width="1" style="cursor:pointer" onclick="goCity(${c.code})"
      data-tip="<b>${esc(c.name)}</b><br>הצבעה ${pc(c.turnout)} (${pp(c.turnout_delta)})<br>גוש נתניהו ${pc(c.blocs.N)} (${pp(c.bloc_swing.N)})"/>`;
  });
  el.innerHTML = `<svg viewBox="0 0 ${W} ${H}" width="100%" style="direction:ltr">${g}</svg>`;

// ---------- COALITION + SEAT CALCULATOR
let coal = { src: "counted", sel: null, agreements: null };
function baderOfer(votes, agreements, seats = 120, thr = 0.0325) {
  const valid = Object.values(votes).reduce((a, b) => a + b, 0), res = {};
  Object.keys(votes).forEach(l => res[l] = 0);
  if (!valid) return res;
  const pass = Object.keys(votes).filter(l => votes[l] > 0 && votes[l] >= valid * thr);
  const vp = pass.reduce((a, l) => a + votes[l], 0);
  pass.forEach(l => res[l] = Math.floor(votes[l] / vp * seats));
  const used = new Set(), units = [];
  for (const [a, b] of agreements) if (pass.includes(a) && pass.includes(b) && !used.has(a) && !used.has(b)) { units.push([a, b]); used.add(a); used.add(b); }
  pass.forEach(l => { if (!used.has(l)) units.push([l]); });
  const uv = units.map(u => u.reduce((s, l) => s + votes[l], 0)), us = units.map(u => u.reduce((s, l) => s + res[l], 0));
  let left = seats - us.reduce((a, b) => a + b, 0);
  while (left-- > 0 && units.length) { let bi = 0, bq = -1; units.forEach((u, i) => { const q = uv[i] / (us[i] + 1); if (q > bq) { bq = q; bi = i; } }); us[bi]++; }
  units.forEach((u, i) => { if (u.length === 1) { res[u[0]] = us[i]; return; } let r = us[i] - res[u[0]] - res[u[1]]; const [a, b] = u; while (r-- > 0) { if (votes[a] / (res[a] + 1) >= votes[b] / (res[b] + 1)) res[a]++; else res[b]++; } });
  return res;
}
function renderCoalition() {
  try { if (coal.agreements == null) coal.agreements = JSON.parse(localStorage.getItem("em-agreements") || "null"); } catch (e) {}
  if (coal.agreements == null) coal.agreements = S.agreements.active.slice();
  const votes = {}, proj = coal.src === "proj" && S.projection;
  S.parties.forEach(p => { votes[p.letter] = proj ? (p.proj_pct || 0) * S.projection.expected_valid : p.votes; });
  const totalVotes = Object.values(votes).reduce((a, b) => a + b, 0) || 1;
  const seats = baderOfer(votes, coal.agreements), plain = baderOfer(votes, []);
  const ps = S.parties.filter(p => seats[p.letter] > 0).sort((a, b) => seats[b.letter] - seats[a.letter]);
  if (!coal.sel) coal.sel = new Set(ps.filter(p => p.bloc === "N").map(p => p.letter));
  const total = ps.filter(p => coal.sel.has(p.letter)).reduce((a, p) => a + seats[p.letter], 0);
  const groups = ps.slice().sort((a, b) => BLOC_ORDER.indexOf(a.bloc) - BLOC_ORDER.indexOf(b.bloc) || (a.bloc === "N" ? seats[a.letter] - seats[b.letter] : seats[b.letter] - seats[a.letter]))
    .map(p => ({ key: p.letter, n: seats[p.letter], color: pColor(p), label: `${p.short_he} (${p.letter})` }));
  const opts = S.parties.filter(p => (p.pct || 0) >= 0.01);
  $("#view").innerHTML = `
  <div class="grid g-main">
    <div class="card"><h2>בונה הקואליציות <small>לחצו על מפלגה כדי להוסיף או להסיר</small>
      <span class="tools seg" id="csrc"><button data-s="counted">לפי הספירה</button><button data-s="proj"${S.projection ? "" : " disabled"}>לפי התחזית</button></span></h2>
      ${hemicycle(groups, { highlight: coal.sel, center: total, caption: total >= 61 ? "✓ רוב בכנסת" : `חסרים ${61 - total} לרוב`, clickable: "toggleCoal" })}
      <div class="meter mt">${ps.filter(p => coal.sel.has(p.letter)).map(p => `<div style="flex:${seats[p.letter]};background:${pColor(p)}" data-tip="${esc(p.short_he)}: ${seats[p.letter]}">${seats[p.letter]}</div>`).join("")}<div style="flex:${Math.max(0, 120 - total)};border:none"></div><span class="line" style="inset-inline-start:${61 / 120 * 100}%"></span></div>
      <div class="chips mt">${ps.map(p => `<span class="chip${coal.sel.has(p.letter) ? " on" : ""}" onclick="toggleCoal(${js(p.letter)})"><span class="sw" style="background:${pColor(p)}"></span>${esc(p.short_he)} <b>${seats[p.letter]}</b></span>`).join("")}</div>
      <div class="controls mt"><span class="sub">קיצורים:</span>${Object.keys(CFG.blocs).map(k => `<button onclick="presetCoal(${js(k)})">${esc(blocName(k))}</button>`).join("")}<button onclick="presetCoal('')">ניקוי</button></div>
    </div>
    <div class="card"><h2>מחשבון מנדטים והסכמי עודפים <small>האתר אינו מפרסם את ההסכמים – הוסיפו כאן ובדקו את השפעתם</small></h2>
      <div class="controls"><select id="ag1">${opts.map(p => `<option value="${esc(p.letter)}">${esc(p.short_he)}</option>`).join("")}</select> ⇄ <select id="ag2">${opts.map(p => `<option value="${esc(p.letter)}">${esc(p.short_he)}</option>`).join("")}</select><button class="primary" id="agAdd">הוספת הסכם</button></div>
      <div class="chips">${coal.agreements.map((a, i) => `<span class="chip on">${esc(party(a[0]).short_he)} ⇄ ${esc(party(a[1]).short_he)} <a href="javascript:void 0" onclick="delAg(${i})" style="text-decoration:none" title="הסרה">✕</a></span>`).join("") || '<span class="muted">אין הסכמים</span>'}</div>
      <table class="mt"><thead><tr><th>רשימה</th><th class="n">אחוז</th><th class="n">מנדטים עם ההסכמים</th><th class="n">בלי הסכמים</th><th class="n">שינוי</th></tr></thead><tbody>
      ${ps.map(p => { const d = seats[p.letter] - plain[p.letter]; return `<tr><td>${letterBadge(p)} ${esc(p.short_he)}</td><td class="n">${pc(votes[p.letter] / totalVotes, 2)}</td><td class="n"><b>${seats[p.letter]}</b></td><td class="n muted">${plain[p.letter]}</td><td class="n ${d > 0 ? "up" : d < 0 ? "down" : ""}">${d ? (d > 0 ? LRM + "+" : LRM) + d : ""}</td></tr>`; }).join("")}
      </tbody></table>
      <div class="note">ההסכמים נשמרים בדפדפן זה בלבד. הסכם חל רק אם שתי הרשימות עברו את אחוז החסימה.</div>
    </div>
  </div>`;
  $$("#csrc button").forEach(b => { b.classList.toggle("on", b.dataset.s === coal.src); b.onclick = () => { coal.src = b.dataset.s; renderCoalition(); }; });
  $("#agAdd").onclick = () => { const a = $("#ag1").value, b = $("#ag2").value; if (a && b && a !== b && !coal.agreements.some(x => x.includes(a) || x.includes(b))) { coal.agreements.push([a, b]); saveAg(); renderCoalition(); } else toast("כל רשימה יכולה להיות בהסכם אחד בלבד"); };

// ---------- TIMELINE
function lineChart(series, yMax, yFmt, refLine, refLabel) {
  const H = (S.history || []).filter(h => h.valid > 0);
  if (H.length < 2) return '<p class="muted">נדרשים לפחות שני עדכונים.</p>';
  const W = 900, Ht = 280, m = { l: 44, r: 130, t: 12, b: 26 };
  const xs = i => m.l + i / (H.length - 1) * (W - m.l - m.r), ys = v => m.t + (1 - Math.min(v, yMax) / yMax) * (Ht - m.t - m.b);
  const lbl = h => h.vt || h.t.slice(11, 16);
  let g = "";
  for (let k = 0; k <= 4; k++) { const v = yMax * k / 4; g += `<line x1="${m.l}" x2="${W - m.r}" y1="${ys(v)}" y2="${ys(v)}" stroke="var(--border)"/><text x="${m.l - 6}" y="${ys(v) + 4}" text-anchor="end">${yFmt(v)}</text>`; }
  if (refLine != null) g += `<line x1="${m.l}" x2="${W - m.r}" y1="${ys(refLine)}" y2="${ys(refLine)}" stroke="var(--text)" stroke-dasharray="4 3"/><text x="${m.l + 4}" y="${ys(refLine) - 5}" style="direction:rtl;unicode-bidi:plaintext">${refLabel}</text>`;
  [0, H.length - 1].forEach(i => g += `<text x="${xs(i)}" y="${Ht - 6}" text-anchor="${i ? "end" : "start"}" style="unicode-bidi:plaintext">${esc(lbl(H[i]))}</text>`);
  series.forEach(s => {
    const pts = H.map((h, i) => [i, s.get(h)]).filter(p => p[1] != null);
    if (!pts.length) return;
    g += `<polyline fill="none" stroke="${s.color}" stroke-width="2" points="${pts.map(([i, v]) => `${xs(i).toFixed(1)},${ys(v).toFixed(1)}`).join(" ")}"/>`;
    const [li, lv] = pts[pts.length - 1];
    g += `<circle cx="${xs(li)}" cy="${ys(lv)}" r="4" fill="${s.color}" stroke="var(--surface)" stroke-width="2"/><text x="${xs(li) + 8}" y="${ys(lv) + 4}" style="direction:rtl;unicode-bidi:plaintext">${esc(s.label)} ${yFmt(lv)}</text>`;
  });
  const step = Math.max(1, Math.floor(H.length / 150));
  for (let i = 0; i < H.length; i += step) { const h = H[i]; g += `<rect x="${xs(i) - (W / H.length * step) / 2}" y="${m.t}" width="${W / H.length * step}" height="${Ht - m.t - m.b}" fill="transparent" data-tip="${esc(lbl(h))} · נספרו ${pc(h.progress)}<br>${series.map(s => `${esc(s.label)}: ${s.get(h) == null ? "–" : yFmt(s.get(h))}`).join("<br>")}"/>`; }
  return `<svg viewBox="0 0 ${W} ${Ht}" width="100%" style="direction:ltr">${g}</svg>`;
}
function renderTimeline() {
  const blocs = S.blocs.map(b => ({ label: blocName(b.key), color: blocColor(b.key), get: h => h.blocs[b.key] ? (h.blocs[b.key][2] ?? h.blocs[b.key][1]) : null }));
  const topP = S.parties.filter(p => (p.pct || 0) >= 0.03).slice(0, 8);
  $("#view").innerHTML = `
  <div class="card"><h2>מנדטים לגושים לאורך הספירה <small>לפי התחזית</small></h2>${lineChart(blocs, 80, v => Math.round(v), 61, "רוב 61")}</div>
  <div class="grid g-2 mt">
    <div class="card"><h2>אחוז הרשימות הגדולות</h2>${lineChart(topP.map(p => ({ label: p.short_he, color: pColor(p), get: h => h.parties[p.letter] ? h.parties[p.letter][0] : null })), Math.min(0.5, Math.max(0.1, ...topP.map(p => p.pct || 0)) * 1.25), v => (v * 100).toFixed(0) + "%", 0.0325, "חסימה")}</div>
    <div class="card"><h2>קצב הספירה</h2>${lineChart([{ label: "נספרו", color: "var(--accent)", get: h => h.progress }], 1, v => Math.round(v * 100) + "%")}</div>
  </div>`;
}

// ---------- FEED
function renderFeed() {
  const s = STATUS || {}, cand = s.candidates || {};
  const row = (k, v) => `<tr><td class="muted">${k}</td><td style="white-space:normal">${v}</td></tr>`;
  $("#view").innerHTML = `<div class="card"><h2>מקור הנתונים</h2><table><tbody>
    ${s.sim ? row("מצב", "<b>סימולציה</b> – נתוני דמה המבוססים על תוצאות 2022 מהאתר, עם שינויים אקראיים") : ""}
    ${row("אתר התוצאות", s.site ? `<a href="${esc(s.site)}" target="_blank" rel="noopener">${esc(s.site)}</a>` : "–")}
    ${row("סטטוס באתר", esc(s.site_status || "–"))}
    ${row("סיכום ארצי באתר", s.site_totals ? `בעלי זכות ${nf(s.site_totals.eligible)} · מצביעים ${nf(s.site_totals.voters)} · כשרים ${nf(s.site_totals.valid)}` : "–")}
    ${row("קובץ יישובים (expc)", `<code dir="ltr">${esc(s.expc_url || "–")}</code>`)}
    ${row("קובץ קלפיות (expb)", `<code dir="ltr">${esc(s.expb_url || "–")}</code>`)}
    ${row("בדיקות / שינויים", `${nf(s.polls)} / ${nf(s.changes)} · כל ${s.poll_seconds} שניות`)}
    ${row("בדיקה / שינוי אחרונים", `${esc(s.last_poll || "–")} / ${esc(s.last_change || "–")}`)}
    ${row("שגיאה אחרונה", esc(s.last_error || s.site_error || "אין"))}
    ${S ? row("קידוד / חתימה", `<code dir="ltr">${esc((S.meta.encoding || "") + " " + (S.meta.hash || ""))}</code>`) : ""}
    ${row("כתובות שנבדקות", `<code dir="ltr" style="white-space:pre-wrap">${(cand.expc || []).concat(cand.expb || []).map(esc).join("\n")}</code>`)}
  </tbody></table>
  <p class="note">הקבצים מאותרים מתוך דפי האתר עצמו (קישורי ההורדה של expc.csv ו-expb.csv). אם האתר חוסם גישה אוטומטית ניתן להעלות את הקבצים ידנית בכפתור "העלאת CSV".</p></div>`;
}

load();
setInterval(load, 3000);
let rT; addEventListener("resize", () => { clearTimeout(rT); rT = setTimeout(() => { if (location.hash.startsWith("#/cities")) scatter(); }, 200); });
</script>
